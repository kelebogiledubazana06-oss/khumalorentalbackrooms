  <main>
    <h2>Our Rental Backrooms</h2>

    <!-- Interactive Filtering Controls Panel -->
    <div class="filter-controls" style="margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; background-color: #112233; padding: 15px; border-radius: 6px; align-items: flex-end;">
      
      <div>
        <label style="color: white; display: block; font-size: 14px; margin-bottom: 4px;">Search Bedrooms:</label>
        <input type="text" id="room-search" placeholder="e.g. 1 Bedroom, 2 Bedrooms, 3 Bedrooms" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 220px;">
      </div>

      <div>
        <label style="color: white; display: block; font-size: 14px; margin-bottom: 4px;">Availability Status:</label>
        <select id="status-filter" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
          <option value="all">Show All Rooms</option>
          <option value="available">Available Now Only</option>
        </select>
      </div>

      <div>
        <label style="color: white; display: block; font-size: 14px; margin-bottom: 4px;">Sort By Price:</label>
        <select id="price-sort" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
          
          <option value="low-high">Low to High</option>
          <option value="high-low">High to Low</option>
        </select>
      </div>

      <div>
        <!-- search button -->
        <button type="button" id="search-btn" style="color: white; background-color: #0f1d3a; padding: 10px 20px; border-radius: 4px; text-decoration: none; border: 1px solid #334455;">Search</button>
      </div>

    </div>

    
    <div id="rooms-display-container" class="rooms-container" style="display: flex; flex-direction: column; gap: 20px;">
    </div>

    <div style="margin-top: 40px; margin-bottom: 20px;">
        <a href="contact.html" style="color: white; background-color: #0f1d3a; padding: 10px 20px; border-radius: 4px; text-decoration: none; border: 1px solid #334455;">Rent Now / Request a Quote</a>
    </div>
  </main>
